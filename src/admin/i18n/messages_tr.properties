unmanagedAttributesHelpText=Yönetilmeyen öznitelikler, kullanıcı profili yapılandırmasında açıkça tanımlanmamış kullanıcı öznitelikleridir. Varsayılan olarak, yönetilmeyen öznitelikler `Devre dışı`dır ve kayıt, hesap ve yönetim konsolu gibi herhangi bir bağlamdan kullanılamazlar. `Etkin` olarak ayarlayarak, yönetilmeyen öznitelikler sunucu tarafından tamamen tanınır ve tüm bağlamlar aracılığıyla erişilebilir hale gelir, bu mevcut bir realm'i bildirimsel kullanıcı profiline taşımaya başlıyorsanız ve henüz kullanıcı profili yapılandırmasında tanımlanmış tüm kullanıcı öznitelikleriniz yoksa yararlıdır. `Yalnızca yöneticiler yazabilir` olarak ayarlayarak, yönetilmeyen öznitelikler yalnızca yönetim konsolu ve API aracılığıyla yönetilebilir, bu kullanıcılar tarafından yönetilebilen özel öznitelikler tanımladıysanız ancak yalnızca yöneticiler tarafından yönetilmesi gereken diğer öznitelikleri ekleme konusunda emin değilseniz yararlıdır. `Yalnızca yöneticiler görüntüleyebilir` olarak ayarlayarak, yönetilmeyen öznitelikler salt okunurdur ve yalnızca yönetim konsolu ve API aracılığıyla kullanılabilir.
