clientPkceRequiredHelp=Yetkilendirme kodu ele geçirilmesine yönelik saldırılara karşı koruma sağlamak için Proof Key for Code Exchange (PKCE) kullanılmasını zorunlu kılar. İstemci kimlik doğrulaması devre dışı olan genel istemciler, istemci gizli anahtarlarını güvenli şekilde saklayamadıkları için PKCE’yi her zaman zorunlu kılmalıdır. Gizli istemciler için de ek bir güvenlik katmanı olarak önerilir. Zorunlu değilse, Keycloak PKCE’yi yalnızca istemci yetkilendirme isteğinde bir kod doğrulaması ve yöntemi içerdiğinde kullanır.
