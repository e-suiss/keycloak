supportsClientAssertionReuseHelp=Varsayılan olarak, bir istemci iddiası birden fazla kez kullanılamaz. İstemci her istek için yeni bir istemci iddiası alamıyorsa, aynı istemci iddiasının yeniden kullanılmasına izin vermek için bu seçenek etkinleştirilebilir.
supportsClientAssertionsHelp=Bu ayar, sağlayıcı tarafından verilen istemci iddialarını kullanarak istemcilerin kimlik doğrulamasını desteklemeyi sağlar. Bunun için, bu Kimlik sağlayıcısının Veren Kuruluşu ve anahtarlarının ayarlanması gerekir. Anahtarlar, bu seçenek etkinleştirildiğinde gösterilen yukarıdaki 'JWKS URL' veya 'Doğrulama genel anahtarı' seçeneklerinin ayarlanmasıyla belirlenebilir.
bindingRequired=Kriptografik bağlama gerekli
