signingKeyIdHelp=İsteğe bağlıdır. Kimlik bilgisini imzalamak için kullanılan realm anahtarının kimliğidir. Belirtilmezse, varsa “Kimlik Bilgisi İmzalama Algoritması” seçeneğinde belirtilen algoritmaya ait realm’in etkin imzalama anahtarı otomatik olarak kullanılır. Bir anahtar seçilirse, “Kimlik Bilgisi İmzalama Algoritması” seçeneği devreden çıkar ve otomatik olarak anahtarın algoritmasına göre ayarlanır.
