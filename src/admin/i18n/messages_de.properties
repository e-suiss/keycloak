scopeParameterHelp=Sie können diesen Wert des Scope Parameters kopieren und ihn in der ersten OpenID Connect Authentication Request einfügen die von diesem Client Adapter gesendet wird. Standard Client-Scopes und ausgewählte optionale Client-Scopes werden verwendet wenn ein Token für diesen Client ausgestellt wird.
