requiredUserActionsHelp=Requière une action quand l'utilisateur se connecte. 'Vérifier le mail' envoie un mail à l'utilisateur pour vérifier l'adresse mail de l'utilisateur. 'Mettre à jour le profil' demande à l'utilisateur d'entrer de nouvelles informations personnelles. 'Mettre à jour le mot de passe' demande à l'utilisateur d'entrer un nouveau mot de passe. 'Configurer l'OTP' demande à l'utilisateur de mettre en place un générateur de mot de passe sur téléphone.
ldapKerberosSettingsDescription=Cette section contient des options utiles pour l'intégration Kerberos. Ceci est utilisé seulement quand le serveur LDAP est utilisé avec l'authentification utilisateur Kerberos/SPNEGO.
deleteEvents=Supprimer les évènements
requestObjectSignatureAlgorithmHelp=Algorithme JWA que le client devra utiliser pendant l'envoi d'un objet de requête OIDC spécifié par les paramètres 'request'ou 'request_uri'. Si mis à 'Tout', l'objet de la requête peut être signé par n'importe quel algorithme (y compris 'Aucun').
clientSecretError=Impossible de regénérer le secret client à cause de : {{error}}
resourcePath=Chemin de la ressource
useJwksUrlHelp=Si activé les clés publiques du fournisseur d'identité sont téléchargées depuis une URL JWKS donnée. Ceci offre une grande flexibilité car les nouvelles clés sont téléchargées de nouveau quand le fournisseur d'identité génère une nouvelle paire de clés. Si désactivé une clé publique (ou une certificat) est utilisé depuis la base de données Keycloak. Par conséquent quand une pair de clé du fournisseur d'identité change vous devez importer de nouveau la nouvelle clé dans la base de donnée Keycloak.
generatedIdTokenHelp=Voir le jeton ID d'exemple, qui sera généré et envoyé au client quand l'utilisateur sélectionné sera authentifié. Vous pouvez voir les attributs et les rôles que le jeton contiendra en utilisant les mappeurs de protocole actifs et les mappings de périmètre de rôle, ceci montre également les attributs et les rôles assignés à l'utilisateur sélectionné.
fullNameLdapWriteOnlyHelp=Pour l'écriture seule, les données sont propagées au LDAP quand un utilisateur est créé ou mis à jour sur Keycloak. Mais ce mappeur n'est pas utilisé pour propager en retour les données depuis le LDAP vers Keycloak. Ce paramètre est utile si vous avez configuré séparément les mappeurs d'attributs 'firstName' et 'lastName' et que vous voulez les utiliser pour lire l'attribut depuis le LDAP vers Keycloak.
eventTypes.OAUTH2_DEVICE_VERIFY_USER_CODE_ERROR.description=Erreur de code utilisateur de vérification d'appareil OAuth2
keysIntro=Si "Utiliser URL JWKS" est activé, vous devez remplir une URL JWKS valide. Après avoir sauvegardé, les administrateurs peuvent télécharger les clés depuis l'URL JWKS ou les clés seront téléchargées automatiquement par le serveur Keycloak quand un KID inconnu est repéré pendant l'authentification client.
frontchannelLogoutOIDCHelp=Si activé la déconnexion nécessite que le navigateur envoie la requête à l'URL configurée de déconnexion du canal principal du client comme spécifiée dans les spécifications de déconnexion du canal principal OIDC. Si désactivé le serveur peut faire une déconnexion en arrière plan tant que soit l'URL de déconnexion du canal secondaire est configurée soit l'URL administrateur est configurée.
flowDescriptionHelp=Texte d'aide pour la description du nouveau flux
requiredWhenTooltip=Quand des périmètres sont utilisés l'attribut est obligatoire quand au moins l'un des périmètres configurés est appliqué à la requête de connexion. A la fois des périmètres par défaut et optionnel de la requête actuelle sont évalués. Dans les contextes la console administrateur et la console compte, les périmètres ne sont pas évalués et l'attribut n'est pas nécessaire.
uuidLdapAttributeHelp=Nom de l'attribut LDAP qui sera utilisé comme l'identifiant d'objet unique (UUID) pour les objets dans le LDAP. Pour la plupart des fournisseurs de serveur LDAP c'est 'entryUUID', toutefois certains n'ont pas le même UUID. Par exemple pour l'Active directory ce serait 'objectGUID'. Si votre serveur LDAP ne supporte pas le UUID vous pouvez utiliser n'importe quel autre attribut qui est censé être unique entre les utilisateurs LDAP. Par exemple 'uid' ou 'entryDN'.
scopePermissions.clients.configure-description=Permissions de gestion réduites pour l'administrateur. Ne peut pas définir un périmètre, modèle ou mappeur de protocole.
mappedGroupAttributesHelp=Liste des noms d'attributs séparés par des virgules. Ceci pointe vers la liste des attributs du groupe LDAP qui seront mappés comme attributs du groupe dans Keycloak. Laisser vide si aucun attribut de groupe additionnel n'est nécessaire à mapper dans Keycloak.
serverPrincipalHelp=Nom complet du serveur principal pour le service HTTP incluant le serveur et le nom de domaine. Par exemple, HTTP/host.foo.org@FOO.ORG
forwardParametersHelp=Paramètres de requête non standard OpenID Connect/OAuth à transmettre à l'IDP externe depuis la requête initiale de l'application vers le point de terminaison d'autorisation. Plusieurs paramètres peuvent être entrés, séparés par une virgule (,).
invalidateRotatedError=Impossible de supprimer la rotation du secret : {{error}}
client-accesstype.tooltip=Type d'accès du client pour lequel la condition est appliquée. Un client confidentiel active l'authentification client alors qu'un client public désactive l'authentification client. Uniquement porteur est un type client déprécié.
useRefreshTokenForClientCredentialsGrantHelp=Si activé, un jeton de rafraîchissement sera créé et ajouté à la réponse du jeton si les droits d'accès via identifiants client sont utilisés. La norme OAuth 2.0 RFC6749 Section 4.4.3 précise qu'un jeton de rafraîchissement ne devrait pas être généré dans ce cas. Si désactivé, alors aucun jeton de rafraîchissement ne sera généré et la session utilisateur associée sera supprimée.
membershipAttributeTypeHelp=DN signifie que les membres du groupe LDAP sont déclarés dans la forme complète DN. Par exemple 'member: uid=john,ou=users,dc=example,dc=com'. UID signifie que les membres du groupe LDAP sont déclarés dans la forme uid pure, comme par exemple 'memberUid: john'.
eventTypes.AUTHREQID_TO_TOKEN.description=Authreqid vers jeton
policyProvider.aggregate=Réutiliser les politiques existantes pour en construire des plus complexes et garder vos permissions encore plus découplées des politiques qui sont évaluées pendant le traitement des requêtes d'autorisation.
client-updater-trusted-hosts.tooltip=Liste des hôtes de confiance. Dans le cas où la requête d'enregistrement/de mise à jour vient d'un hôte/domaine spécifié dans cette configuration, la condition est évaluée à vrai. Vous pouvez utiliser des noms de domaine ou des adresses IP. Si vous utilisez le joker '*' au début (par exemple '*.example.com'), alors le domaine complet example.com est de confiance.
acrToLoAMappingHelp=Définit quelle valeur d'ACR (Référence de classe de contexte d'authentification) est mappée à quel LoA (Niveau d'authentification). L'ACR peut être n'importe quelle valeur alors que le LoA doit être un nombre.
