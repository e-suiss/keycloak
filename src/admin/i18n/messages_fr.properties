credentialSigningAlgorithmHelp=L'algorithme de signature utilisé pour sélectionner la clé active du domaine pour la signature des identifiants (par exemple "ES256"). Si non spécifié, la clé active sera sélectionnée à l'aide de l'algorithme par défaut du domaine. Cette option est désactivée si un 'ID de clé de signature' spécifique est sélectionné.
