clientPkceRequiredHelp=Nécessite une clé de preuve pour l'échange de code (PKCE - Proof Key for Code Exchange) pour se protéger contre des attaques par interception de code d'autorisation. Les clients publics (authentification client désactivée) devrait toujours nécessiter PKCE car ils ne peuvent pas enregistrer de manière sécurisée les secrets clients. Cela est aussi recommandé pour les clients confidentiels comme couche de sécurité supplémentaire. Si non nécessaire, Keycloak utilise seulement PKCE quand le client inclut un code et une methode de challenge dans sa requête d'autorisation.
