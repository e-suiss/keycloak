removeInvalidUsersHelp=Supprimer les utilisateurs de la base de donnée locale s'ils ne sont pas disponibles depuis le stockage de l'utilisateur à l'exécution des recherches. Si activé, les utilisateurs qui ne sont plus disponibles depuis leur stockage utilisateur correspondant seront supprimés de la base de données locale quand une recherche d'utilisateurs sera effectuée. Si désactivé, alors les utilisateurs importés précédemment depuis le stockage utilisateur seront conservés dans la base de données locale en lecture seule et seront désactivés, même si cet utilisateur n'est plus disponible depuis le stockage utilisateur. Par exemple, un utilisateur qui a été supprimé directement du LDAP ou du `DN utilisateurs` est invalide. Notez que ce comportement arrivera seulement quand l'utilisateur n'est pas encore en cache.
