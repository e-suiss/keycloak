maxSecondaryAuthFailures=Nombre maximum d'échecs d'authentifications secondaires
storeTokenInSessionHelp=Le jeton sera enregistré dans la session utilisateur après l'authentification de l'utilisateur. Cela est nécessaire pour le Token Exchange V1 interne vers externe et peut être utilisé par l'API Identity Brokering V2 pour récupérer le jeton depuis la session actuellement associée.
minimumACRValueSamlHelp=ACR minimum à forcer par Keycloak. Si le contexte d'authentification qui en résulte pour la requête est aussi fort que cet ACR, la requête best valide, sinon Keycloak retourne l'erreur de statut NoAuthnContext.
maxSecondaryAuthFailuresHelp=Nombre maximum d'échecs d'authentification secondaires avant qu'un verrouillage permanent soit déclenché. Le compte sera verrouillé même dans les modes de force brute de verrouillage temporaire. Une valeur de 0 signifie que le comportement est désactivé.
supportsClientAssertionsHelp=Ce paramètre active la prise en charge des assertions clients émises par le fournisseur pour authentifier les clients. Cela nécessite de définir l'Émetteur et les clés pour ce fournisseur d'identités. Les clés peuvent être définies en paramétrant les options de 'URL JWKS' ou 'Validation de la clé publique' ci-dessus, qui sont affichées quand cette option est activée.
supportsClientAssertionReuseHelp=Par défaut, une assertion client ne peut pas être utilisée plusieurs fois. Si le client n'est pas en capacité à récupérer une nouvelle assertion client pour chaque requête, cette option peut être activée pour autoriser la réutilisation de la même assertion client.
acrToLoAMappingRealmSamlHelp=Définit quelle valeur d'ACR (Référence de classe de contexte d'authentification) est mappée à quel LoA (Niveau d'authentification). L'ACR est une valeur libre et est utilisée dans OpenID Connecter, l'URI est le contexte d'authentification pour SAML et est au format d'URI, et le LoA doit être un nombre.
bindingSupportedProofTypes=Types de preuve pris en charge
bindingSupportedProofTypesHelp=Liste des types de preuve acceptés, séparée par des virgules, quand la liaison cryptographique est activée (par exemple : jwt). Si laissé vide, aucun type de preuve ne sera proposé et les preuves ne seront pas exigées.
bindingSupportedProofTypesInvalid=Type de preuve non pris en charge : {{invalid}}. Les valeurs autorisées sont : jwt, attestation
theme.keycloak.v2.admin.description=Plus propre et plus moderne, la v2 prend en charge la bascule automatique entre le mode clair et sombre. (Par défaut pour Administration)
attestationTrust=Confiance par attestation
bindingRequired=Liaison cryptographique exigée
cryptographicBindingMethodsSupported=Méthodes de liaison cryptographique
cryptographicBindingMethodsSupportedHelp=Liste des représentations des éléments de clé cryptographique auxquels les identifiants seront liés, séparée par des virgules (par exemple : jwk). Si laissé vide, aucune méthode de liaison cryptographique ne sera proposée.
cryptographicBindingMethodsSupportedInvalid=Méthode(s) de liaison cryptographique non prise(s) en charge : {{invalid}}. Valeur autorisée : jwk
bindingRequiredHelp=Si activé, cette configuration d'identifiants nécessite une liaison cryptographique au détenteur et des preuves correspondantes. Si désactivé, aucune liaison cryptographique n'est nécessaire et les métadonnées associées seront ignorées.

