repeatHelp=Définit comment la politique de restriction de temps est définie. Si "Sans répétition", la politique est accordée uniquement entre les temps de début et d'expiration. Si " Répétition ", vous pouvez ajouter des restrictions supplémentaires à la politique en spécifiant des périodes de temps comme des plages de mois, jour, heure, minute.
