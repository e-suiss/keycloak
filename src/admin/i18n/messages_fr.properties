timeClaimsStrategy=Stratégie à appliquer aux attributs temporels
timeClaimsStrategyHelp=Stratégie à appliquer aux attributs temporels. Valeurs supportées : aucune, aléatoire, tronquée.
randomizeWindow=Période d'aléa
randomizeWindowHelp=Quand la stratégie est aléatoire, soustrait à l'horodatage initial un nombre aléatoire de secondes, entre 0 et la valeur de cet attribut, afin de limiter les attaques par corrélation.
roundUnit=Unité d'arrondi
roundUnitHelp=Quand la stratégie est Arrondir, tronque l'horodatage au début de l'unité sélectionnée (UTC). Les valeurs supportées : SECONDE, MINUTE, HEURE, JOUR.
randomize=Aléatoire
round=Arrondir
clientSecretAuthenticationAllowedMethod=Méthode d'authentification autorisée
clientSecretAuthenticationAllowedMethodHelp=Méthode d'authentification autorisée pour l'authentification par secret client. Si définie sur "client_secret_basic", alors le secret client doit être envoyé dans le header HTTP 'Authorization: Basic' lors de l'authentification de ce client. Si définie sur "client_secret_post", alors le secret client doit être envoyé en tant sur paramètre dans le corps de la requête, avec le client_id. Lorsque vide, les deux méthodes header "Authorization" et paramètre dans le corps de la requête sont autorisées.
