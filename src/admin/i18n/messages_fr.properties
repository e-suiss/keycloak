strictTransportSecurityHelp=L'entête Strict-Transport-Security HTTP indique au navigateur de toujours utiliser HTTPS. Une fois qu'un navigateur a vu cet entête il visitera uniquement les sites en HTTPS pour la durée spécifiée (1 an) par le max-age, incluant les sous domaines. <formattedlink>En savoir plus</formattedlink>
