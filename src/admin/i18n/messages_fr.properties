enableLdapPasswordPolicy=Activer la politique de mot de passe LDAP
enableLdapPasswordPolicyHelp=Utilise la politique de mot de passe LDAP comme présenté dans le brouillon IETF draft-behera-ldap-password-policy. Quand cette option est activée, il sera demandé aux utilisateurs de changer de mot de passe après connexion si le serveur indique qu'un changement de mot de passe est nécessaire.
