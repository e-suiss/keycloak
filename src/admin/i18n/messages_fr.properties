userInfoResponseEncryptionKeyManagementAlgorithmHelp=Algorithme JWA utilisé pour la gestion de clé dans le chiffrement des réponses du point de terminaison des informations utilisateurs. Cette option est nécessaire si vous voulez chiffrer les réponses du point de terminaison des informations utilisateurs. Si laissé vide, les réponses du point de terminaison des informations utilisateurs ne sont pas chiffrées.
clientTypeHelp='OpenID Connect' autorise les clients à vérifier l'identité de l'utilisateur final en se basant sur l'authentification faite par le serveur d'autorisation. 'SAML' active l'authentification web et les scénarios d'autorisation incluant la connexion unique multi-domaine (SSO) et utilise les jetons de sécurité contenant les assertions pour passer des informations.
searchScopeHelp=Pour un niveau, la recherche s'applique seulement aux utilisateurs dans les Distinguished Names (DNs) spécifiés par les DNs utilisateur. Pour un sous arbre, la recherche s'applique pour le sous arbre entier. Voir la documentation LDAP pour plus de détails.
policyDecisionStagey=La stratégie de décision indique comment les politiques associées avec une permission donnée sont évaluées et comment une décision finale est obtenue. 'Affirmatif' signifie qu'au moins une politique doit être évaluée avec une décision positive pour que la décision finale soit aussi positive. 'Unanime' signifie que toutes les politiques doivent rendre une décision positive pour que la décision finale soit positive. 'Consensus' signifie que le nombre de décisions positives doit être supérieur au nombre de décisions négatives. Si le nombre de décisions positives est le même que le nombre de négatives la décision finale sera négative.
policyProvider.js=Définit les conditions pour vos autorisations en utilisant JavaScript. Ceci est l'un des types de politique basé sur des règles supporté par Keycloak et il offre la flexibilité d'écrire toute politique basée sur l'API d'évaluation.
noGroupsText=Vous n'avez ajouté cet utilisateur à aucun groupe. Rejoignez un groupe pour commencer.
eventTypes.OAUTH2_EXTENSION_GRANT_ERROR.name=Erreur droits d'accès extension OAuth2
userModelAttributeHelp=Nom de la propriété UserModel ou de l'attribut avec lequel mapper l'attribut LDAP. Par exemple 'firstName', 'lastName, 'email', 'street' etc.
encryptionAlgorithmHelp=Algorithme de chiffrement utilisé par le SAML IDP pour chiffrer les documents SAML, les assertions et les identifiants. La clé de déchiffrement correspondante pour déchiffrer les parties du document SAML est choisie en fonction de cet algorithme configuré et doit être disponible dans les clés du domaine pour l'utilisation du chiffrement (ENC). Si aucun algorithme n'est configuré n'importe quel algorithme supporté est autorisé et la clé de déchiffrement est choisie en fonction de l'algorithme configuré dans le document SAML.
relativeUserCreateDnHelp=Nom de domaine (DN) relatif depuis les 'Utilisateurs DN' jusqu'à l'endroit de création des utilisateurs. Par exemple ceci autorise les utilisateurs à être créés dans d'autre DN que le parent 'Utilisateurs DN' pendant l'utilisation d'un périmètre de recherche de sous-arbre.
tokenLifespan.expires=Expire dans
emptyStateMessage=Pas d'attribut de groupe
useKerberosForPasswordAuthenticationHelp=Utiliser le module de connexion Kerberos pour s'authentifier avec un nom d'utilisateur et un mot de passe au serveur Kerberos à la place de s'authentifier au serveur LDAP avec l'API Directory Service.
claimHelp=Nom de l'attribut à rechercher dans le jeton. Vous pouvez référencer les attributs imbriqués en utilisant un point '.' ; par exemple 'address.locality'. Pour utiliser le point (.) littéralement, échappez-le avec un backslash (\\.).
authorizationHelp=Activer/Désactiver le support de l'autorisation à granularité fine pour un client.
masterSamlProcessingUrlHelp=Si configurée, cette URL sera utilisée pour chaque association entre les assertions consommateurs de fournisseurs de services et les services de déconnexion simple. Ceci peut être surchargé individuellement pour chaque association et service dans la configuration du point de terminaison à granularité fine SAML.
idTokenEncryptionKeyManagementAlgorithmHelp=Algorithme JWA utilisé pour la gestion des clés dans le chiffrement des jetons ID. Cette option est obligatoire si vous voulez chiffrer les jetons ID. Si laissé vide, les jetons ID sont juste signés mais pas chiffrés.
idpInitiatedSsoUrlNameHelp=Nom du fragment d'URL pour référencer un client quand vous voulez faire du SSO initié par le fournisseur d'identités (IDP). Laisser ceci vide désactivera le SSO initié par l'IDP. L'URL que vous allez référencer depuis votre navigateur sera : {server-root}/realms/{realm}/protocol/saml/clients/{client-url-name}.
validRequestURIsHelp=Liste des URIs valides qui peuvent être utilisées comme valeurs dans le paramètre 'request_uri' pendant une requête d'authentification OpenID Connect. Aucune fonctionnalité comme celles présentes dans les URIs de redirection valides, comme par exemple le joker '*' ou les chemins relatifs, n'est supportée ici.
oidcAttributeImporter=Importer l'attribut déclaré s'il existe un identifiant (ID), un jeton d'accès ou l'ensemble d'attributs retourné par le point de terminaison du profil utilisateur dans l'attribut ou la propriété utilisateur spécifié.
validRedirectURIs=Schéma d'URL valide vers lequel le navigateur peut rediriger après une connexion réussie. Les jokers sont autorisés comme par exemple 'http://example.com/*'. Un chemin relatif peut aussi être précisé, exemple : /my/relative/path/*. Ces chemins sont relatifs à l'URL racine du client, si aucune URL racine n'est spécifiée l'URL d'authentification racine du serveur est utilisée. Pour SAML vous devez mettre un schéma d'URL valide si vous faîtes confiance sur le service d'URL du consommateur embarqué avec la requête de connexion.
membershipUserLdapAttributeHelp=Utilisé seulement si le type d'attribut d'appartenance est UID. C'est le nom de l'attribut LDAP de l'utilisateur qui est utilisé pour le mapping de l'appartenance. C'est souvent 'uid'. Par exemple si la valeur de 'L'attribut LDAP appartenance utilisateur' est 'uid' et le groupe LDAP a 'memberUid : john' il est attendu que cet utilisateur particulier LDAP aura l'attribut 'uid : john'.
oAuthMutualHelp=Ceci active le support pour les jetons d'accès OAuth2 Mutual TLD associés à un certificat, qui signifie que Keycloak associe un jeton d'accès et un jeton de rafraîchissement avec un certificat X.509 d'un jeton requêtant l'échange client dans le Mutual TLS entre le point de terminaison de jeton de Keycloak et ce client. Ces jetons peuvent être traités comme des jetons Holder-of-Key token au lieu de jetons porteur.
attributesHelp=Nom et expression régulière pour les attributs à chercher dans un jeton. Le nom configuré d'un attribut est cherché dans les champs SAML de nom d'attribut et de nom fonctionnel d'attribut. Toutes les descriptions d'attributs données doivent être satisfaites pour définir le rôle. Si un attribut est un tableau, alors la valeur doit être contenue dans le tableau. Si un attribut peut être trouvé plusieurs fois, alors une seule correspondance suffit.
shortVerificationUriTooltipHelp=Si définie, cette valeur sera retournée comme verification_uri dans le flux d'autorisation de l'appareil. Cette URI doit rediriger vers {server-root}/realms/{realm}/device.
client-updater-source-groups.tooltip=Nom des groupes à vérifier. La condition s'évalue à vrai si l'entité qui crée ou met à jour le client est membre d'un ou plusieurs des groupes spécifiés. Les groupes configurés sont spécifiés par leur nom simple qui doit correspondre au nom du groupe Keycloak. Aucun support pour la hiérarchie de groupe est utilisé ici.
useMetadataDescriptorUrlHelp=Si activé les certificats pour valider les signatures seront téléchargés et cachés depuis l'"URL de descripteur de métadonnées" donnée. L'action "Rechargement de clés" peut être utilisée pour rafraîchir les certificats dans le cache. Si désactivé les certificats depuis l'option "Certificats validants X509" sont utilisés, ils doivent être changés manuellement quand ils sont changés dans le IDP.
