modeHelp=LDAP_ONLY signifie que les tous mappings de groupe d'utilisateurs seront récupérés depuis le LDAP et sauvegardé dans le LDAP. READ_ONLY est un mode en lecture seule du LDAP où les mappings de groupe sont récupérés depuis le LDAP et la base de données et seront fusionnés ensemble. Un nouveau groupe est sauvegardé dans la base de données mais pas dans le LDAP. IMPORT est un mode de lecture seule du LDAP ou les mappings de groupe sont récupérés depuis le LDAP quand l'utilisateur est importé depuis LDAP and sont ensuite sauvegardés dans la base de données locale Keycloak.
