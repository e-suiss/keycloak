policyDecisionStagey=Որոշման ռազմավարությունը թելադրում է, թե ինչպես են գնահատվում տվյալ թույլտվության հետ կապված քաղաքականությունները և ինչպես է ստացվում վերջնական որոշումը: 'Affirmative'-ը նշանակում է, որ առնվազն մեկ քաղաքականություն պետք է գնահատվի դրական, որպեսզի վերջնական որոշումը նույնպես լինի դրական: 'Unanimous'-ը նշանակում է, որ բոլոր քաղաքականությունները պետք է գնահատվեն դրական: 'Consensus'-ը նշանակում է, որ դրական որոշումների քանակը պետք է ավելի մեծ լինի, քան բացասական որոշումների քանակը: Եթե դրական և բացասական որոշումների քանակը հավասար է, վերջնական որոշումը կլինի բացասական:
