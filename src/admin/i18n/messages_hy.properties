expireTimeHelp=Սահմանում է այն ժամանակը, որից հետո քաղաքականությունը ՉՊԵՏՔ է տրամադրվի: Տրամադրվում է միայն այն դեպքում, եթե ընթացիկ ամսաթիվը/ժամանակը նախքան այս արժեքն է կամ հավասար է դրան:
