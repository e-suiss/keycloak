useTruststoreSpiHelp=Նշում է, թե արդյոք LDAP կապը կօգտագործի Truststore SPI-ն command-line ընտրանքներում կարգավորված truststore-ով: 'Միշտ' նշանակում է, որ այն միշտ կօգտագործի այն: 'Երբեք' նշանակում է, որ այն չի օգտագործի այն: Նկատի ունեցեք, որ նույնիսկ եթե Keycloak truststore-ը կարգավորված չէ, լռելյայն java cacerts-ը կամ 'javax.net.ssl.trustStore' հատկությամբ նշված վկայականը կօգտագործվի:
