generateKeysDescription=Եթե գեներացնեք նոր բանալիներ, կարող եք ավտոմատ կերպով ներբեռնել բանալիների պահոցը (keystore) փակ բանալու հետ և պահպանել այն ձեր հաճախորդի կողմում: Keycloak սերվերը կպահպանի միայն վկայականը և հանրային բանալին, բայց ոչ փակ բանալին:
