loa-condition-level.tooltip=Уровень аутентификации. Это значение всегда должно быть целым числом, большим или равным 0. Подсценарии в сценарии аутентификации всегда должны быть упорядочены от низших уровней к более высоким.
loa-max-age=Макс. возраст
loa-max-age.tooltip=Макс. возраст в секундах для этого уровня аутентификации, чтобы быть действительным. Если запрашивается определенный уровень, и пользователь уже прошел аутентификацию с этим уровнем ранее, чем указанное количество секунд назад, ему не будет предложено пройти повторную аутентификацию. Но если он прошел аутентификацию позднее, чем указанное количество секунд назад, ему нужно будет пройти повторную аутентификацию с этим уровнем снова. Значение 0 в конфигурации означает, что пользователю всегда требуется проходить повторную аутентификацию с этим уровнем всякий раз, когда этот уровень запрашивается.
