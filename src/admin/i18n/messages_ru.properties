jwtAuthorizationGrantAudience=Пользовательское сопоставление аудитории
jwtAuthorizationGrantAudienceHelp=Пользовательское сопоставление аудитории для JWT Authorization Grant. Ключ — это псевдоним провайдера идентификации, а значение — кастомная аудитория (audience), применяемая для этого провайдера.
clientSecretAuthenticationAllowedMethodHelp=Разрешенный метод аутентификации секрета клиента. Если установлено значение client_secret_basic, то секрет клиента должен передаваться в HTTP-заголовке 'Authorization: Basic' при аутентификации этого клиента. Если установлено значение client_secret_post, то секрет клиента должен передаваться как параметр в теле запроса вместе с client_id. Если поле пустое, разрешены оба варианта: и заголовок Authorization, и параметры в теле запроса.
maxSecondaryAuthFailures=Максимальное количество неудачных попыток вторичной аутентификации
clientPkceRequiredHelp=Требовать Proof Key for Code Exchange (PKCE) для защиты от атак с перехватом кода авторизации. Публичные клиенты (с отключенной аутентификацией клиента) всегда должны требовать PKCE, так как они не могут безопасно хранить секреты клиента. Это также рекомендуется для конфиденциальных клиентов в качестве дополнительного уровня безопасности. Если требование не установлено, Keycloak использует PKCE только в том случае, если клиент включает code challenge и соответствующий метод в свой запрос на авторизацию.
deleteErrorIdentityProvider=Не удалось удалить маппер провайдера идентификации: '{{error}}'
selectOrgGroup=Выберите группу организации
groupTypeHelp=Указывает, является ли выбранная группа Realm группой или группой организации. Это определяет, где маппер будет искать группу при выполнении.
externalTokenEnabled=Разрешить получение внешних токенов
externalTokenEnabledHelp=Если включено, клиенту разрешено получать внешние токены от провайдера идентификации
externalTokenIdp=Разрешенные провайдеры идентификации для внешних токенов
externalTokenIdpHelp=Выберите провайдеров идентификации, от которых можно получать внешние токены.
minimumACRValueSamlHelp=Минимальный уровень ACR, обеспечиваемый Keycloak. Если итоговый контекст аутентификации для запроса соответствует этому ACR или выше, запрос считается действительным, в противном случае Keycloak возвращает ошибку статуса NoAuthnContext.
maxSecondaryAuthFailuresHelp=Максимальное количество неудачных попыток вторичной аутентификации до срабатывания постоянной блокировки. Аккаунт будет заблокирован даже в режимах защиты от подбора пароля с временной блокировкой. Значение 0 означает, что функция отключена.
jwks=Набор ключей JSON Web Key (JWK Set)
acrToLoAMappingSamlHelp=Определите, какое значение ACR (Authentication Context Class Reference) соответствует какому уровню LoA (Level of Authentication). В протоколе SAML значение ACR представляет собой URI, в то время как LoA должен быть числовым значением.
acrToLoAMappingRealmSamlHelp=Определите, какое значение ACR (Authentication Context Class Reference) соответствует какому уровню LoA (Level of Authentication). В OpenID Connect значение ACR может быть любым, в протоколе SAML контекст аутентификации представляет собой URI, и, наконец, LoA должен быть числовым значением.
enableLdapPasswordPolicyHelp=Использовать политику паролей LDAP, как описано в черновике IETF draft-behera-ldap-password-policy. Если эта опция включена, пользователям будет предложено сменить пароль при входе в систему, если сервер укажет, что смена пароля необходима.
oidcClientSecretHelp=Секретный ключ, зарегистрированный для клиента. Это поле может получать значение из хранилища, используйте формат ${vault.ID}.
storeTokenInSessionHelp=Токен будет храниться в сессии пользователя после прохождения аутентификации. Это необходимо для работы функции обмена токенов (Token Exchange V1) между внутренними и внешними системами, а также может использоваться Identity Brokering API V2 для извлечения токена из текущей связанной сессии.
storeTokenInSession=Сохранять токен в сессии
allowClientIdAsAudience=Разрешить использование Client ID в качестве аудитории (audience) для утверждений (assertions)
allowClientIdAsAudienceHelp=Если включено, идентификатор клиента (Client ID), настроенный в поставщике удостоверений, является единственным допустимым значением аудитории (audience) для утверждений, используемых при аутентификации федеративного клиента и в грантах авторизации JWT (Client Assertions и JWT Authorization Grant). Вместо token-url/issuer-url, определенных в соответствующих спецификациях, используется Client ID. Обратите внимание, что данное поведение не описывается стандартами.
fedClientAssertionMaxExp=Максимальный срок действия для Client Assertions
fedClientAssertionMaxExpHelp=Максимально допустимый срок действия для Federated Client Assertions.
inviteNewUser=Пригласить нового пользователя
inviteRealmUser=Пригласить Realm пользователя
organizationInvitationsSent_one=Приглашение отправлено Realm пользователю
organizationInvitationsSent_other=Приглашения отправлены {{count}} Realm пользователям
organizationInvitationsSentError=Не удалось пригласить пользователей в организацию: {{error}}
themeDescriptionDefault=Пользовательская тема, созданная инструментом Quick theme.
credentialSigningAlgorithm=Алгоритм подписи учетных данных
credentialSigningAlgorithmHelp=Алгоритм подписи, используемый для выбора активного ключа Realm для подписи учетных данных (например, «ES256»). Если не указан, активный ключ будет выбран с использованием алгоритма Realm по умолчанию. Этот параметр отключен, если выбран конкретный 'Идентификатор ключа подписи'.
hashAlgorithmHelp=Алгоритм хеширования, используемый для учетных данных SD-JWT (например, "SHA-256"). Если не указан, по умолчанию используется "SHA-256".
useDefaultAlg=Использовать алгоритм по умолчанию
emptyUserWorkflowsInstructions=Для этого пользователя нет запланированных рабочих процессов.
pending=В ожидании
whichWorkflowsWillAppear=Какие рабочие процессы будут отображаться в этом списке?
whichWorkflowsWillAppearDetail=Здесь будут отображаться рабочие процессы этого пользователя, имеющие хотя бы один шаг в ожидании. Некоторые полностью завершенные процессы также могут отображаться, если планировщик еще не удалил их.
hideOnLoginWhenOrgNotResolved=Скрывать на странице входа, если организация не определена
hideOnLoginWhenOrgNotResolvedHelp=Если включено, поставщик удостоверений будет скрыт на странице входа, если организацию невозможно определить по домену электронной почты пользователя. В противном случае поставщик удостоверений будет отображаться на странице входа независимо от того, определена организация или нет. Если также включена опция 'Скрывать на странице входа', поставщик удостоверений будет скрыт на странице входа всегда.
role_realm-admin=Администратор Realm
role_query-clients=Запросить клиентов
role_query-groups=Запросить группы
role_query-users=Запросить пользователей
role_default-roles=Роли по умолчанию
role_impersonation=Имитация пользователя
role_read-token=Прочитать токен
role_offline-access=Оффлайн доступ
role_uma_authorization=Получение разрешений
scimApiEnabled=SCIM API
scimApiEnabledHelp=Если включено, ресурсы Realm становятся доступны через API, основанный на спецификации системы управления трансграничными идентификационными данными (SCIM), а именно RFC7643 и RFC7644.
supportsClientAssertionsHelp=Эта настройка включает поддержку использования клиентских утверждений, выпущенных поставщиком для аутентификации клиентов. Это требует настройки издателя и ключей данного поставщика удостоверений. Ключи можно задать с помощью параметров 'URL-адрес JWKS' или 'Проверяющий открытый ключ' выше, которые отображаются при включении этой опции.
supportsClientAssertionReuseHelp=По умолчанию клиентское утверждение не может быть использовано несколько раз. Если клиент не может получать новое утверждение для каждого запроса, можно включить эту опцию, чтобы разрешить повторное использование одного и того же утверждения.

