authenticatorRefConfig.value.help=Добавьте пользовательское имя ссылки для аутентификатора. Когда этот аутентификатор успешно завершен во время сценария аутентификации, сопоставление протокола Authentication Method Reference (AMR) будет использовать это значение для заполнения клейма amr сгенерированных токенов. Обратите внимание, что протокол AMR должен быть настроен для данного клиента для заполнения клейма AMR.
