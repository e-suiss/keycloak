unmanagedAttributesHelpText=Неуправляемые атрибуты — это атрибуты пользователя, которые явно не определены в конфигурации профиля пользователя. По умолчанию неуправляемые атрибуты "Отключены" и недоступны из любого контекста, например регистрации, учетной записи и консоли администрирования. При установке значения "Включено" неуправляемые атрибуты полностью распознаются сервером и доступны во всех контекстах. Это полезно, если вы начинаете перенос существующей области в декларативный профиль пользователя и у вас еще не определены все атрибуты пользователя в конфигурации профиля пользователя. Если установить "Запись разрешена только администраторам", неуправляемыми атрибутами можно будет управлять только через консоль администрирования и API. Это полезно, если вы уже определили какой-либо настраиваемый атрибут, которым могут управлять пользователи, но не уверены в необходимости добавления других атрибутов, которыми должны управлять только администраторы. Если установить "Просмотр разрешен только администраторам", неуправляемые атрибуты будут доступны только для чтения и только через консоль администрирования и API.
