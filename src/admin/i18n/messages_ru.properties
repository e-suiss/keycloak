idTokenAsDetachedSignatureHelp=Это позволяет использовать ID токен, возвращаемый конечной точкой авторизации в гибридном потоке OIDC, в качестве отдельной подписи, определённой в расширенном профиле безопасности FAPI 1.0. Следовательно, этот ID токен не содержит информацию об аутентифицированном пользователе.
allowutf8Help=Включите, чтобы разрешить использование символов UTF-8 в локальной части адреса электронной почты. Этот параметр следует включать только в том случае, если почтовый сервер поддерживает UTF-8 через расширение SMTPUTF8. Если этот параметр отключен, доменные имена, содержащие символы UTF-8, будут кодироваться с помощью punycode, а адреса, содержащие символы UTF-8 в локальной части адреса, будут возвращать ошибку.
