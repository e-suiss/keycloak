showInAccountConsoleHelp=Определяет, как поставщик удостоверений будет доступен из консоли учётной записи. Если установлено значение «Всегда», он будет доступен всегда. Если установлено значение «Когда привязано», он будет отображаться только при наличии связи пользователя с ним. В противном случае, если установлено значение «Никогда», он не будет доступен, даже если пользователь с ним связан.
showInAccountConsole.always=Всегда
showInAccountConsole.when_linked=Когда привязано
