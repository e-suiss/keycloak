authenticatorRefConfig.maxAge.help=Макс. возраст в секундах, в течение которого значение ссылки аутентификатора действительно в сессии SSO. При использовании сопоставления протокола Authentication Method Reference (AMR) AMR будет считаться действительным и заполняться в токене только в том случае, если выполнение аутентификатора было завершено в течение указанного максимального возраста.
