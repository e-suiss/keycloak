editModeKerberosHelp=READ_ONLY 表示不允許更新密碼，使用者始終使用 Kerberos 密碼進行身份驗證。UNSYNCED 表示使用者可以在 Keycloak 資料庫中更改密碼，並將使用該密碼而不是 Kerberos 密碼。
