validRedirectURIsHelp=URL a cui il browser può reindirizzare dopo un accesso riuscito. Sono ammessi semplici caratteri jolly, come "http://example.com/*". Si possono specificare anche percorsi relativi, come "/my/relative/path/*". I percorsi sono relativi all'URL principale (root) del client o, se non è specificato, all'URL principale del server di autenticazione. Per SAML è necessario impostare almeno un URL valido se si vuole fare affidamento sull'URL ricevuto nella richiesta di accesso.
