unmanagedAttributesHelpText=Kudeatugabeko atributuak erabiltzaile profilaren konfigurazioan esplizituki definituta ez dauden erabiltzaile atributuak dira. \
  Lehenespenez, kudeatugabeko atributuak `Desgaituta` daude eta ez daude eskuragarri inolako testuingurutan hala nola erregistroan, kontuan eta administrazio kontsolan. \
  `Gaituta` ezarriz, kudeatugabeko atributuak zerbitzariak erabat ezagutzen ditu eta testuinguru guztietatik eskuragarriak dira, erabilgarria existitzen den eremu bat erabiltzaile profil deklaratibora migratzen hasten ari bazara eta oraindik ez baduzu erabiltzaile atributu guztiak erabiltzaile profilaren konfigurazioan definituta. \
  `Administratzaileek soilik idatzi dezakete` ezarriz, kudeatugabeko atributuak administrazio kontsolaren eta APIaren bidez soilik kudea daitezke, erabilgarria erabiltzaileek kudea dezaketen atributu pertsonalizatu bat dagoeneko definituta baduzu baina ziur ez bazaude administratzaileek soilik kudeatu behar dituzten beste atributu batzuk gehitzeaz. \
  `Administratzaileek soilik ikusi dezakete` ezarriz, kudeatugabeko atributuak irakurtzeko soilik dira eta administrazio kontsolaren eta APIaren bidez soilik eskuragarriak dira.
