periodicFullSyncHelp='Inportatu erabiltzaileak' gaituta badago, aldiko zeregin bat hasten da erabiltzaileak LDAP-tik Keycloak-era sinkronizatzeko. Sinkronizazio mota honek LDAP-ko erabiltzaile guztiak eskuratzen ditu exekuzio bakoitzean, erabiltzaile berriak inportatuz edo existitzenak eguneratuz. LDAP-n erabiltzaile kopuru handia baduzu, hau eraginkorra ez izan daiteke. Kasu horretan, aukera hau desgaitu eta 'Aldatutako erabiltzaileen aldizkako sinkronizazioa' erabili dezakezu horren ordez.
periodicChangedUsersSyncHelp='Inportatu erabiltzaileak' gaituta badago, aldiko zeregin bat hasten da erabiltzaileak LDAP-tik Keycloak-era sinkronizatzeko sortutako edo azken eguneratze denbora-zigiluen oinarrituta. Sinkronizazio mota hau sinkronizazio oso bat baino eraginkorragoa da, bereziki LDAP-n erabiltzaile kopuru handia baduzu. Hala ere, zure LDAP zerbitzariak 'createTimestamp' eta 'modifyTimestamp' atributuak kontsulta predikatuetan erabiliz bilaketak onartzen dituela behar du.
signatureAlgorithmHelp=Dokumentuak sinatzeko erabili beharreko sinadura algoritmoa. Kontuan izan 'SHA1' oinarritutako algoritmoak zaharkituta daudela eta etorkizunean kendu daitezkeela. Gomendagarria da '*_SHA1' baino algoritmo seguruago bat erabiltzea.
allow-default-scopes.tooltip=Aktibatuta badago, erregistratutako bezero berriek eremu esparru lehenetsitan edo eremu aukerako bezero esparruetan aipatutako bezero esparruak edukitzeko baimena izango dute
