`Иштетилген` кылсаңыз, сервер аларды толук тааныйт жана бардык контексттерде жеткиликтүү болот. Бул эски realmди декларативдүү колдонуучу профилине которууну баштаганда пайдалуу. \
`Факультативдүү администрациянын жазуусу` орнотулса, атрибуттарды жөн гана администраторлор гана башкарса болот, колдонуучулардын башкаруусундагы кээ бир өзгөчөлүктөрдү сактап калуу үчүн ылайыктуу. \
`Факультативдүү администрациянын көрүүсү` орнотулса, атрибуттар окууга гана жеткиликтүү болуп, башкаруу консолу жана API аркылуу гана көрүлөт.
